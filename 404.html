<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Found · Amaziah &amp; Santana</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#08080a; color:#fdfaf2;
      min-height:100dvh; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      font-family:'Cormorant Garamond',serif; padding:2rem; text-align:center;
    }
    .crown{font-size:.85rem; letter-spacing:.55em; color:rgba(236,211,150,.55); margin-bottom:1.6rem;}
    h1{font-family:'Cinzel',serif; font-weight:600; letter-spacing:.28em; font-size:clamp(1.4rem,4vw,2rem); margin-bottom:1.2rem;}
    .rule{width:60px; height:1px; background:rgba(236,211,150,.4); margin:0 auto 1.6rem;}
    p{font-style:italic; font-size:1.1rem; max-width:420px; line-height:1.85; color:rgba(253,250,242,.75); margin-bottom:1.8rem;}
    a{
      display:inline-block; font-family:'Cinzel',serif; font-size:.78rem; font-weight:600;
      letter-spacing:.28em; text-transform:uppercase; color:#1a1208;
      background:linear-gradient(180deg,#ecd396,#c4a45c);
      padding:.95rem 2.2rem; text-decoration:none; border-radius:2px;
      box-shadow:0 12px 30px rgba(196,164,92,.34);
    }
    a:hover{background:linear-gradient(180deg,#fff0c2,#ecd396);}
  </style>
</head>
<body>
  <main>
    <p class="crown">⸻ ✦ ⸻</p>
    <h1>PAGE NOT FOUND</h1>
    <div class="rule"></div>
    <p>That page seems to have wandered off down a Verona side street. Let's get you back to the celebration.</p>
    <a href="/">Return Home</a>
  </main>
</body>
</html>
